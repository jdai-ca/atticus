providers:
  - id: openai
    name: OpenAI
    displayName: OpenAI
    description: GPT-5 collection of models
    endpoint: https://api.openai.com/v1/chat/completions
    defaultModel: gpt-5.5

    models:
      - id: gpt-5.5
        name: GPT-5.5
        description: Ultimate model with unmatched performance and capabilities
        maxContextWindow: 1000000
        defaultMaxTokens: 128000
        maxMaxTokens: 128000
        inputTokenPrice: 5.00
        outputTokenPrice: 30.00
        enabled: true

      - id: gpt-5.4
        name: GPT-5.4
        description: Latest and most advanced model with unparalleled capabilities
        maxContextWindow: 1000000
        defaultMaxTokens: 128000
        maxMaxTokens: 128000
        inputTokenPrice: 2.50
        outputTokenPrice: 15.00
        enabled: true

      - id: gpt-5.4-mini
        name: GPT-5.4 Mini
        description: Balanced performance and cost for general tasks
        maxContextWindow: 400000
        defaultMaxTokens: 128000
        maxMaxTokens: 128000
        inputTokenPrice: 0.75
        outputTokenPrice: 4.50
        enabled: true

      - id: gpt-5.4-nano
        name: GPT-5.4 Nano
        description: Cost-effective version of GPT-5 for general tasks
        maxContextWindow: 400000
        defaultMaxTokens: 128000
        maxMaxTokens: 128000
        inputTokenPrice: 0.20
        outputTokenPrice: 1.25
        enabled: true

    capabilities:
      supportsMultimodal: true
      supportsRAG: true
      supportsVision: true
      supportsFunctionCalling: true
      supportsTemperature: false

    authentication:
      apiKeyFormat: sk-...
      apiKeyLabel: API OpenAI
      getApiKeyUrl: https://platform.openai.com/api-keys

    ui:
      icon: "🤖"
      order: 1
  - id: anthropic
    name: Anthropic
    displayName: Anthropic AI
    description: Claude 4 & 5 family - Fable, Opus, Sonnet, and Haiku
    endpoint: https://api.anthropic.com/
    defaultModel: claude-sonnet-4-6

    models:
      - id: claude-fable-5
        name: Claude 5 Fable
        description: Latest, most capable model for complex reasoning and coding
        maxContextWindow: 1000000
        defaultMaxTokens: 64000
        maxMaxTokens: 128000
        inputTokenPrice: 10.00
        outputTokenPrice: 50.00
        enabled: true

      - id: claude-opus-4-8
        name: Claude 4.8 Opus
        description: Latest, powerful model for highly complex tasks
        maxContextWindow: 1000000
        defaultMaxTokens: 64000
        maxMaxTokens: 128000
        inputTokenPrice: 5.00
        outputTokenPrice: 25.00
        enabled: true

      - id: claude-sonnet-5
        name: Claude 5 Sonnet
        description: Latest intelligent model, best for complex analysis and coding
        maxContextWindow: 1000000
        defaultMaxTokens: 64000
        maxMaxTokens: 128000
        inputTokenPrice: 3.00
        outputTokenPrice: 15.00
        enabled: true

      - id: claude-haiku-4-5
        name: Claude 4.5 Haiku
        description: Fastest and most compact model
        maxContextWindow: 200000
        defaultMaxTokens: 16384
        maxMaxTokens: 64000
        inputTokenPrice: 1.00
        outputTokenPrice: 5.00
        enabled: true

    capabilities:
      supportsMultimodal: true
      supportsRAG: true
      supportsVision: true
      supportsFunctionCalling: true
      supportsTemperature: true

    authentication:
      apiKeyFormat: sk-ant-...
      apiKeyLabel: API Anthropic
      getApiKeyUrl: https://console.anthropic.com/settings/keys

    ui:
      icon: "🧠"
      order: 2
  - id: google
    name: Google
    displayName: Google AI
    description: Gemini Pro, Flash 3.x family of models via Google Cloud
    defaultModel: gemini-3.1-pro-preview

